# Netlify config for the Pristine Clean site.
# Drag the `site` folder onto app.netlify.com/drop, or connect this repo
# and set the publish directory to "site".

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/services"
  to = "/index.html#services"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
